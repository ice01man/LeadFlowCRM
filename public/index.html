<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · LeadFlow CRM · Revoluxia</title>
  <meta name="description" content="LeadFlow CRM, gestión comercial con inteligencia de tendencias. Un producto de Revoluxia, soluciones tecnológicas.">
  <meta name="theme-color" content="#1f4e6e">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/icono-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/base.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <main class="centrado">
    <img class="logo logo-completo solo-claro" src="/img/revoluxia-logo.png" alt="Revoluxia, soluciones tecnológicas">
    <img class="logo logo-completo solo-oscuro" src="/img/revoluxia-logo-claro.png" alt="Revoluxia, soluciones tecnológicas">
    <form class="tarjeta" id="form-login" novalidate>
      <h1>LeadFlow CRM</h1>
      <p class="sub">Ingresá con tu cuenta.</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <p class="pie">LeadFlow CRM es un producto de <a href="https://www.facebook.com/profile.php?id=100095303406062" rel="noopener" target="_blank">Revoluxia</a> · soluciones tecnológicas</p>
  </main>
</body>
</html>
